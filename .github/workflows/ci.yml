name: ECO - CI de calidad

on:
  push:
    branches: [main, Sprint-3]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  documentation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Comprobar enlaces Markdown del repositorio
        run: python3 scripts/check_markdown_links.py
      - name: Validar configuracion Docker Compose (sin iniciar servicios)
        run: docker compose --env-file .env.example config --quiet
      - name: Validar configuracion staging sin desplegar
        run: docker compose --env-file .env.staging.example -f docker-compose.staging.yml config --quiet
      - name: Verificar build de frontend estatico para staging
        run: docker build --file src/frontend/Dockerfile.staging --tag ecologistica-staging-check:ci src/frontend

  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/backend
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: src/backend/requirements.lock
      - name: Instalar dependencias
        run: >-
          python -m pip install --only-binary=:all: --require-hashes -r requirements.lock
      - name: Pruebas del comprobador de enlaces y cobertura
        working-directory: .
        run: |
          python -m coverage run --source=scripts -m unittest discover -s scripts -p 'test_*.py'
          python -m coverage xml -o coverage-scripts.xml
      - name: Conservar cobertura del comprobador
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: cobertura-herramientas
          path: coverage-scripts.xml
          if-no-files-found: error
      - name: Pruebas y cobertura minima 80 %
        run: python -m pytest -q --cov=app --cov-report=term-missing --cov-report=xml:coverage.xml --cov-fail-under=80
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: cobertura-backend
          path: src/backend/coverage.xml
          if-no-files-found: warn

  postgres-integration:
    name: PostgreSQL integration and audit rollback
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: ecologistica_test
          POSTGRES_PASSWORD: ci-test-only
          POSTGRES_DB: ecologistica_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ecologistica_test -d ecologistica_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql+psycopg://ecologistica_test:ci-test-only@127.0.0.1:5432/ecologistica_test
      DATABASE_URL: postgresql+psycopg://ecologistica_test:ci-test-only@127.0.0.1:5432/ecologistica_test
    defaults:
      run:
        working-directory: src/backend
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: src/backend/requirements.lock
      - name: Install backend test dependencies
        run: >-
          python -m pip install --only-binary=:all: --require-hashes -r requirements.lock
      - name: Run full test suite against isolated PostgreSQL
        run: python -m pytest -q --cov=app --cov-report=term-missing --cov-fail-under=80
      - name: Verify schema upgrades and migration head on empty test database
        run: |
          python -m alembic upgrade head
          python -m alembic current
          python -m alembic check


  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/frontend
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: src/frontend/package-lock.json
      - name: Instalar dependencias
        run: npm ci --ignore-scripts
      - name: Pruebas de frontend
        run: npm run test:coverage
      - name: Conservar cobertura frontend
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: cobertura-frontend
          path: src/frontend/coverage/lcov.info
          if-no-files-found: error
      - name: TypeScript y compilacion
        run: npm run build

  sonarcloud:
    name: SonarQube Cloud and quality gate
    needs: [documentation, backend, frontend]
    if: github.repository == 'RodrigoAC12/Ecolog-stica_Lima' && github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: cobertura-backend
          path: src/backend
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: cobertura-frontend
          path: src/frontend/coverage
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: cobertura-herramientas
          path: .
      - name: Analizar codigo completo e importar cobertura
        id: scan
        uses: SonarSource/sonarqube-scan-action@4d1dc0c91ee400dcf8a6dddf2f705ac36542e304 # v8.4.0
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          args: -Dproject.settings=sonar-project.cloud.properties
      - name: Exportar evidencia del analisis de esta revision
        if: always()
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_SCAN_OUTCOME: ${{ steps.scan.outcome }}
        run: python3 scripts/export_sonarcloud_report.py
      - name: Conservar evidencia Cloud
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: sonarcloud-report
          path: sonarcloud-report.json
          if-no-files-found: warn
