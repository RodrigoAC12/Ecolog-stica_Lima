name: ECO - Dependency audit

on:
  push:
    branches: [main, Sprint-3]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  python:
    name: Audit Python dependencies
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Install locked audit tooling
        run: >-
          python -m pip install --only-binary=:all: --require-hashes -r .github/requirements-audit.lock
      - name: Audit backend dependency tree
        run: python -m pip_audit -r src/backend/requirements.lock --format json --output python-audit.json --progress-spinner off
      - name: Publish audit evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: python-dependency-audit
          path: python-audit.json
          if-no-files-found: warn

  node:
    name: Audit frontend dependency tree
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/frontend
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: src/frontend/package-lock.json
      - name: Audit including development dependencies (high and critical)
        run: npm audit --audit-level=high --json > npm-audit.json
      - name: Publish audit evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: frontend-dependency-audit
          path: src/frontend/npm-audit.json
          if-no-files-found: warn
